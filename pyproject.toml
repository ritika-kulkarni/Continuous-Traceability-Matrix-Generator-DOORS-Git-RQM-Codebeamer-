[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceability-matrix"
version = "1.0.0"
description = "ASPICE Continuous Traceability Matrix Generator (DOORS ↔ Git ↔ RQM ↔ Codebeamer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Automotive Quality Engineering" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "jinja2>=3.1.4",
    "structlog>=24.4.0",
    "click>=8.1.7",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=62.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[project.scripts]
traceability = "traceability.cli:main"

[tool.hatch.build]
[tool.hatch.build.targets.wheel]
packages = ["src/traceability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: integration tests with mocked external systems",
    "unit: fast isolated unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["traceability"]
mypy_path = "src"
