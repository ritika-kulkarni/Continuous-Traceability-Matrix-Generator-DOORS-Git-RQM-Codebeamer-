name: nightly-matrix

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf]"
      - name: Generate ASPICE matrix
        env:
          BUILD_ID: nightly-${{ github.run_number }}
          DOORS_PASSWORD: ${{ secrets.DOORS_PASSWORD }}
          CODEBEAMER_TOKEN: ${{ secrets.CODEBEAMER_TOKEN }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          RQM_PASSWORD: ${{ secrets.RQM_PASSWORD }}
        run: bash scripts/nightly_matrix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aspice-traceability-matrix
          path: artifacts/
